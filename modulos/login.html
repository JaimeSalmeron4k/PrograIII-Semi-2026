<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden login-card animate-fade-in">
            <div class="card-header bg-gradient-primary text-white text-center py-4 border-0">
                <div class="login-icon-box mb-3 mx-auto shadow-sm">
                    <i class="bi bi-shield-lock-fill text-primary fs-2"></i>
                </div>
                <h4 class="fw-bold mb-1">Inicio de Sesión</h4>
                <p class="small text-white-50 mb-0">Sistema de Gestión Académica - UGB</p>
            </div>

            <div class="card-body p-4 p-sm-5 bg-white">
                <div id="loginAlerta" class="alert d-none mb-4 py-2 px-3 small border-0 shadow-sm" role="alert"></div>

                <form id="frmLogin" onsubmit="event.preventDefault(); iniciarSesion();">
                    <div class="mb-3">
                        <label for="txtUsuarioLogin" class="form-label small fw-semibold text-secondary">
                            <i class="bi bi-person me-1 text-primary"></i> Nombre de Usuario
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control bg-light border-start-0" id="txtUsuarioLogin" placeholder="Ingrese su usuario" autocomplete="username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="txtClaveLogin" class="form-label small fw-semibold text-secondary">
                            <i class="bi bi-key me-1 text-primary"></i> Contraseña
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" class="form-control bg-light border-start-0 border-end-0" id="txtClaveLogin" placeholder="••••••••" autocomplete="current-password" required>
                            <button class="btn btn-light border border-start-0 text-muted" type="button" onclick="alternarVerClave('txtClaveLogin', 'iconEyeLogin')">
                                <i class="bi bi-eye" id="iconEyeLogin"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm d-flex justify-content-center align-items-center gap-2" id="btnIniciarSesion">
                        <i class="bi bi-box-arrow-in-right fs-5"></i>
                        <span>Ingresar al Sistema</span>
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-2 text-muted small border-0">
                Programación III &bull; UGB Usulután
            </div>
        </div>
    </div>
</div>
